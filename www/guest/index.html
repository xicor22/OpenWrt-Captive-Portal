<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Wi-Fi Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 32px 28px;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      border: 1px solid #334155;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 3C6.95 3 2.5 5.3 0 8.92l12 14.61 12-14.61C21.5 5.3 17.05 3 12 3zm0 4c3.34 0 6.36 1.45 8.44 3.76L12 21.05 3.56 10.76C5.64 8.45 8.66 7 12 7z"/>
      </svg>
    </div>
    <h2>Guest Network</h2>
    <p>Enter the 6-digit Authenticator code to authorize internet access.</p>
    <form action="/cgi-bin/auth" method="POST">
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="------" required autofocus autocomplete="one-time-code">
      <button type="submit">Connect (24 Hours)</button>
    </form>
    <div class="footer">Secure Portal &bull; OpenWrt Protected</div>
  </div>
</body>
</html>
